name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'completion/**'
      - 'doc/**'
      - 'git-mr-completion.bash'
      - 'LICENSE'
      - 'README.md'
  push:
#    branches:
#      - master
    paths-ignore:
      - 'completion/**'
      - 'doc/**'
      - 'git-mr-completion.bash'
      - 'LICENSE'
      - 'README.md'

jobs:

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install shellcheck
          LC_ALL=C.UTF-8 shellcheck git-mr

  test:
    name: Test
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-24.04
          - windows-2025
          - macos-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            bash \
            gnu-sed \
            grep

      - name: Show versions
        run: |
          bash --version
          grep --version
          git --version

      - name: Setup BATS
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          support-install: false # submodule
          assert-install: false # submodule
          detik-install: false # unused
          file-install: false # unused

      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests on ${{ matrix.os }}
        shell: bash
        run: bats --print-output-on-failure --formatter tap ./test
